<!doctype html>
<html>
  <head>
    <title>Leaflet debug page</title>

    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet.markercluster": "../dist/leaflet.markercluster-esm.js"
        }
      }
    </script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
      integrity="sha512-/Zt0ZlKYvvW9BBzNnOHT+QYeT/cGTk6OC4mKrI/FOJXDDvgABw7lUBBMoqDnpOS4HgQ8LwdL+yJ7ArjBoL7ITQ=="
      crossorigin="anonymous"
      type="module"
    ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../screen.css" />

    <link rel="stylesheet" href="../../dist/MarkerCluster.css" />
    <link rel="stylesheet" href="../../dist/MarkerCluster.Default.css" />
    <script src="../../src/DistanceGrid.js" type="module"></script>
    <script src="../../src/MarkerCluster.js" type="module"></script>
    <script src="../../src/MarkerClusterGroup.js" type="module"></script>
    <script src="../../src/MarkerCluster.QuickHull.js" type="module"></script>
    <script src="../../src/MarkerCluster.Spiderfier.js" type="module"></script>
  </head>
  <body>
    <div id="map"></div>
    <button id="populate">Populate 1 marker</button>
    <span
      >Bug <a href="https://github.com/danzel/Leaflet.markercluster/issues/69">#69</a>. Click the button 2+ times. Zoom out. Should just be a single cluster but instead one of the
      child markers is still visible.</span
    ><br />
    <script type="module">
      import { Map, TileLayer, LatLng, Marker, DomUtil } from "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js";
      import { MarkerClusterGroup } from "../../dist/leaflet.markercluster-esm.js";

      var tiles = new TileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }),
        latlng = new LatLng(50.5, 30.51);

      var map = new Map("map", { center: new LatLng(50.41, 30.51), zoom: 17, layers: [tiles] });

      var markers = new MarkerClusterGroup({ animateAddingMarkers: true });
      var markersList = [];

      function populate() {
        var m = new Marker(latlng);
        markersList.push(m);
        markers.addLayer(m);
        return false;
      }

      map.addLayer(markers);

      //Ugly add/remove code
      DomUtil.get("populate").onclick = function () {
        populate();
      };
    </script>
  </body>
</html>
