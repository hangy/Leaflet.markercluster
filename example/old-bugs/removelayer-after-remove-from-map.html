<!doctype html>
<html>
  <head>
    <title>Leaflet debug page</title>

    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet.markercluster": "../dist/leaflet.markercluster-esm.js"
        }
      }
    </script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
      integrity="sha512-/Zt0ZlKYvvW9BBzNnOHT+QYeT/cGTk6OC4mKrI/FOJXDDvgABw7lUBBMoqDnpOS4HgQ8LwdL+yJ7ArjBoL7ITQ=="
      crossorigin="anonymous"
      type="module"
    ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../screen.css" />

    <link rel="stylesheet" href="../../dist/MarkerCluster.css" />
    <link rel="stylesheet" href="../../dist/MarkerCluster.Default.css" />
    <script src="../../src/DistanceGrid.js" type="module"></script>
    <script src="../../src/MarkerCluster.js" type="module"></script>
    <script src="../../src/MarkerClusterGroup.js" type="module"></script>
    <script src="../../src/MarkerCluster.QuickHull.js" type="module"></script>
    <script src="../../src/MarkerCluster.Spiderfier.js" type="module"></script>
  </head>
  <body>
    <div id="map"></div>
    <a href="#" onclick="swapLayers()">1 - Swap layers</a><br />
    <a href="#" onclick="removeMarker()">2 - Remove all markers</a><br />
    <a href="#" onclick="swapLayers()">3 - Swap layers again =&gt; Marker is still there</a><br />

    <span>Bug <a href="https://github.com/danzel/Leaflet.markercluster/issues/160">#160</a>. Click 1,2,3. There should be nothing on the map.</span><br />
    <script type="module">
      import { LatLng, LatLngBounds , Map, Marker, TileLayer } from "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js";
      import { MarkerClusterGroup } from "../../dist/leaflet.markercluster-esm.js";

      var map = new Map("map");

      var tiles = new TileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      });
      map.addLayer(tiles);

      var objectBounds = [
        [44.98131207805678, 6.0726203025917],
        [44.981459751363204, 6.073026722623153]
      ];
      map.fitBounds(new LatLngBounds(objectBounds));

      var markers1 = new MarkerClusterGroup();
      var markers2 = new MarkerClusterGroup();

      map.addLayer(markers1);

      var aMarker = new Marker(new LatLng(44.9813, 6.07262));
      var anotherMarker = new Marker(new LatLng(44.9814, 6.072621));

      markers1.addLayer(aMarker);
      markers2.addLayer(anotherMarker);

      const swapLayers = function () {
        if (map.hasLayer(markers1)) {
          map.removeLayer(markers1);
          map.addLayer(markers2);
        } else {
          map.removeLayer(markers2);
          map.addLayer(markers1);
        }
      };

      const removeMarker = function () {
        markers1.removeLayer(aMarker);
        markers2.removeLayer(anotherMarker);
      };
    </script>
  </body>
</html>
