<!doctype html>
<html>
  <head>
    <title>Leaflet debug page</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.0.3/dist/leaflet.css"
      integrity="sha512-07I2e+7D8p6he1SIM+1twR5TIrhUQn9+I6yjqD53JQjFiMf8EtC93ty0/5vJTZGF8aAocvHYNEDJajGdNx1IsQ=="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.0.3/dist/leaflet-src.js"
      integrity="sha512-WXoSHqw/t26DszhdMhOXOkI7qCiv5QWXhH9R7CgvgZMHz1ImlkVQ3uNsiQKu5wwbbxtPzFXd1hK4tzno2VqhpA=="
      crossorigin=""
    ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../screen.css" />

    <link rel="stylesheet" href="../../dist/MarkerCluster.css" />
    <link rel="stylesheet" href="../../dist/MarkerCluster.Default.css" />
    <script src="../../src/DistanceGrid.js"></script>
    <script src="../../src/MarkerCluster.js"></script>
    <script src="../../src/MarkerClusterGroup.js"></script>
    <script src="../../src/MarkerCluster.QuickHull.js"></script>
    <script src="../../src/MarkerCluster.Spiderfier.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <button id="doit">setView</button><br />
    <span
      >Bug <a href="https://github.com/danzel/Leaflet.markercluster/issues/63">#63</a>. Zoom down on the very left side untill markers are visible. Click the button. Scroll to the
      left in one go, those markers should be in clusters but the actual markers will still be visible.</span
    ><br />
    <span id="time"></span>
    <script type="text/javascript">
      //Mobile does different bounds to desktop, makes the bug easier to reproduce
      new .Browser.mobile = true;

      var tiles = new TileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }),
        latlng = new LatLng(50.5, 30.51);

      var map = new Map("map", { center: latlng, zoom: 15, layers: [tiles] });

      var markers = new MarkerClusterGroup();
      var markersList = [];

      function getRandomLatLng(map) {
        var bounds = map.getBounds(),
          southWest = bounds.getSouthWest(),
          northEast = bounds.getNorthEast(),
          lngSpan = northEast.lng - southWest.lng,
          latSpan = northEast.lat - southWest.lat;

        return new LatLng(southWest.lat + latSpan * Math.random(), southWest.lng + lngSpan * Math.random());
      }

      function populate(length) {
        for (var i = 0; i < length; i++) {
          var m = new Marker(getRandomLatLng(map));
          markers.addLayer(m);
        }
      }

      populate(1000);
      map.addLayer(markers);

      DomUtil.get("doit").onclick = function () {
        map.setView(new LatLng(50.5, 30.525), 15);
      };
    </script>
  </body>
</html>
