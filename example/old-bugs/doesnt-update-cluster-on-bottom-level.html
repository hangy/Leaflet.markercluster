<!doctype html>
<html>
  <head>
    <title>Leaflet debug page</title>

    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet.markercluster": "../dist/leaflet.markercluster-esm.js"
        }
      }
    </script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
      integrity="sha512-/Zt0ZlKYvvW9BBzNnOHT+QYeT/cGTk6OC4mKrI/FOJXDDvgABw7lUBBMoqDnpOS4HgQ8LwdL+yJ7ArjBoL7ITQ=="
      crossorigin="anonymous"
      type="module"
    ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../screen.css" />

    <link rel="stylesheet" href="../../dist/MarkerCluster.css" />
    <link rel="stylesheet" href="../../dist/MarkerCluster.Default.css" />
    <script src="../../src/DistanceGrid.js" type="module"></script>
    <script src="../../src/MarkerCluster.js" type="module"></script>
    <script src="../../src/MarkerClusterGroup.js" type="module"></script>
    <script src="../../src/MarkerCluster.QuickHull.js" type="module"></script>
    <script src="../../src/MarkerCluster.Spiderfier.js" type="module"></script>
  </head>
  <body>
    <div id="map"></div>
    <button id="doit">AddMarker</button><button id="doit2">Add by Timer</button><br />
    <span
      >Bug <a href="https://github.com/danzel/Leaflet.markercluster/issues/114">#114</a>. Markers are added to the map periodically using addLayers. Bug was that after becoming a
      cluster (size 2 or 3 usually) they would never change again even if more markers were added to them.</span
    ><br />

    <script type="module">
      import { LatLng, Map, Marker, TileLayer } from "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js";
      import { MarkerClusterGroup } from "../../dist/leaflet.markercluster-esm.js";

      var tiles = new TileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }),
        latlng = new LatLng(40.782982, -73.969452);

      var map = new Map("map", {
        center: latlng,
        zoom: 12,
        maxZoom: 12,
        layers: [tiles]
      });

      var markerCluster = new MarkerClusterGroup();
      map.addLayer(markerCluster);

      function getRandomLatLng() {
        return [40.782982 + (Math.random() > 0.5 ? 0.5 : -0.5) * Math.random(), -73.969452 + (Math.random() > 0.5 ? 0.5 : -0.5) * Math.random()];
      }

      document.getElementById("doit").onclick = function () {
        markerCluster.addLayers([new Marker(map.getCenter())]);
      };
      document.getElementById("doit2").onclick = function () {
        setInterval(function () {
          var n = 100;
          var markers = new Array();

          for (var i = 0; i < n; i++) {
            markers.push(new Marker(getRandomLatLng()));
          }

          markerCluster.addLayers(markers);
        }, 1000);
      };
    </script>
  </body>
</html>
