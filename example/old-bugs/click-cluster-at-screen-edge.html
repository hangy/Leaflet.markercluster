<!doctype html>
<html>
  <head>
    <title>Leaflet debug page</title>

    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet.markercluster": "../dist/leaflet.markercluster-esm.js"
        }
      }
    </script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
      integrity="sha512-/Zt0ZlKYvvW9BBzNnOHT+QYeT/cGTk6OC4mKrI/FOJXDDvgABw7lUBBMoqDnpOS4HgQ8LwdL+yJ7ArjBoL7ITQ=="
      crossorigin="anonymous"
      type="module"
    ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../screen.css" />

    <link rel="stylesheet" href="../../dist/MarkerCluster.css" />
    <link rel="stylesheet" href="../../dist/MarkerCluster.Default.css" />
    <script src="../../src/DistanceGrid.js" type="module"></script>
    <script src="../../src/MarkerCluster.js" type="module"></script>
    <script src="../../src/MarkerClusterGroup.js" type="module"></script>
    <script src="../../src/MarkerCluster.QuickHull.js" type="module"></script>
    <script src="../../src/MarkerCluster.Spiderfier.js" type="module"></script>
  </head>
  <body>
    <div id="map"></div>
    <span
      >Bug <a href="https://github.com/leaflet/Leaflet.markercluster/issues/344">#344</a>. Click the cluster at the screen edge. Map will zoom to it and its markers will appear,
      but it will not disappear.</span
    ><br />
    <span id="time"></span>
    <script type="module">
      import { DivIcon, LatLng, Map, Marker, Point, TileLayer } from "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js";
      import { MarkerClusterGroup } from "../../dist/leaflet.markercluster-esm.js";

      var iconCreateFunction = function (cluster) {
        var childCount = cluster.getChildCount();

        var c = " marker-cluster-";
        if (childCount < 10) {
          c += "small";
        } else if (childCount < 100) {
          c += "medium";
        } else {
          c += "large";
        }

        return new DivIcon({ html: "<div><span>" + childCount + "</span></div>", className: "marker-cluster" + c, iconSize: new Point(270, 270) });
      };

      var tiles = new TileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }),
        latlng = new LatLng(54.18815548107151, 6.1083984375);

      var map = new Map("map", { center: latlng, zoom: 5, layers: [tiles] });

      var markers = new MarkerClusterGroup({ iconCreateFunction: iconCreateFunction });
      var markersList = [];

      markers.addLayer(new Marker([41.969073, 5]));
      markers.addLayer(new Marker([41.969073, 7]));

      map.addLayer(markers);
    </script>
  </body>
</html>
