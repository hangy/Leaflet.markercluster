<!doctype html>
<html>
  <head>
    <title>Leaflet debug page</title>

    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet.markercluster": "../dist/leaflet.markercluster-esm.js"
        }
      }
    </script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
      integrity="sha512-/Zt0ZlKYvvW9BBzNnOHT+QYeT/cGTk6OC4mKrI/FOJXDDvgABw7lUBBMoqDnpOS4HgQ8LwdL+yJ7ArjBoL7ITQ=="
      crossorigin="anonymous"
      type="module"
    ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="screen.css" />

    <link rel="stylesheet" href="../dist/MarkerCluster.css" />
    <link rel="stylesheet" href="../dist/MarkerCluster.Default.css" />

    <style>
      .mycluster {
        width: 40px;
        height: 40px;
        background-color: greenyellow;
        text-align: center;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script type="module">
      import { Map, TileLayer, LatLng, Marker, DivIcon, Point } from "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js";
      import { MarkerClusterGroup } from "../dist/leaflet.markercluster-esm.js";

      var tiles = new TileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }),
        latlng = new LatLng(50.5, 30.51);

      var map = new Map("map", { center: latlng, zoom: 15, layers: [tiles] });

      //Custom radius and icon create function
      var markers = new MarkerClusterGroup({
        maxClusterRadius: 120,
        iconCreateFunction: function (cluster) {
          var markers = cluster.getAllChildMarkers();
          var n = 0;
          for (var i = 0; i < markers.length; i++) {
            n += markers[i].number;
          }
          return new DivIcon({ html: n, className: "mycluster", iconSize: new Point(40, 40) });
        },
        //Disable all of the defaults:
        spiderfyOnMaxZoom: false,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: false
      });

      function populate() {
        for (var i = 0; i < 100; i++) {
          var m = new Marker(getRandomLatLng(map), { title: i });
          m.number = i;
          markers.addLayer(m);
        }
        return false;
      }
      function populateRandomVector() {
        for (var i = 0, latlngs = [], len = 20; i < len; i++) {
          latlngs.push(getRandomLatLng(map));
        }
        var path = new Polyline(latlngs);
        map.addLayer(path);
      }
      function getRandomLatLng(map) {
        var bounds = map.getBounds(),
          southWest = bounds.getSouthWest(),
          northEast = bounds.getNorthEast(),
          lngSpan = northEast.lng - southWest.lng,
          latSpan = northEast.lat - southWest.lat;

        return new LatLng(southWest.lat + latSpan * Math.random(), southWest.lng + lngSpan * Math.random());
      }

      populate();
      map.addLayer(markers);

      var shownLayer, polygon;

      function removePolygon() {
        if (shownLayer) {
          shownLayer.setOpacity(1);
          shownLayer = null;
        }
        if (polygon) {
          map.removeLayer(polygon);
          polygon = null;
        }
      }

      markers.on("clustermouseover", function (a) {
        removePolygon();

        a.layer.setOpacity(0.2);
        shownLayer = a.layer;
        polygon = new Polygon(a.layer.getConvexHull());
        map.addLayer(polygon);
      });
      markers.on("clustermouseout", removePolygon);
      map.on("zoomend", removePolygon);
    </script>
  </body>
</html>
