<!doctype html>
<html>
  <head>
    <title>Leaflet debug page</title>

    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet/src/core": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet/src/dom": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet/src/geo": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet/src/geometry": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet/src/layer": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet/src/layer/marker": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",          
          "leaflet/src/layer/vector": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",          
          "leaflet.markercluster": "../dist/leaflet.markercluster-esm.js"
        }
      }
    </script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
      integrity="sha512-/Zt0ZlKYvvW9BBzNnOHT+QYeT/cGTk6OC4mKrI/FOJXDDvgABw7lUBBMoqDnpOS4HgQ8LwdL+yJ7ArjBoL7ITQ=="
      crossorigin="anonymous"
      type="module"
    ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="screen.css" />

    <link rel="stylesheet" href="../dist/MarkerCluster.css" />
    <link rel="stylesheet" href="../dist/MarkerCluster.Default.css" />

    <script type="text/javascript" src="geojson-sample.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <span>Mouse over a cluster to see the bounds of its children and click a cluster to zoom to those bounds</span>
    <script type="module">
      import { Map, TileLayer, LatLng, Marker, GeoJSON, Polyline } from "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js";
      import { MarkerClusterGroup } from "../dist/leaflet.markercluster-esm.js";
      
      var tiles = new TileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }),
        latlng = new LatLng(0.78, 102.37);

      var map = new Map("map", { center: latlng, zoom: 7, layers: [tiles] });

      var geojson = new GeoJSON(geojsonSample, {
        style: function (feature) {
          return { color: feature.properties.color };
        },

        onEachFeature: function (feature, layer) {
          var popupText = "geometry type: " + feature.geometry.type;

          if (feature.properties.color) {
            popupText += "<br/>color: " + feature.properties.color;
          }

          layer.bindPopup(popupText);
        }
      });

      geojson.addLayer(new Marker(new LatLng(2.745530718801952, 105.194091796875)));

      var eye1 = new Marker(new LatLng(-0.7250783020332547, 101.8212890625));
      var eye2 = new Marker(new LatLng(-0.7360637370492077, 103.2275390625));
      var nose = new Marker(new LatLng(-1.3292264529974207, 102.5463867187));
      var mouth = new Polyline([
        new LatLng(-1.3841426927920029, 101.7333984375),
        new LatLng(-1.6037944300589726, 101.964111328125),
        new LatLng(-1.6806671337507222, 102.249755859375),
        new LatLng(-1.7355743631421197, 102.67822265625),
        new LatLng(-1.5928123762763, 103.0078125),
        new LatLng(-1.3292264529974207, 103.3154296875)
      ]);

      var markers = new MarkerClusterGroup();
      markers.addLayer(geojson).addLayers([eye1, eye2, nose, mouth]);

      map.addLayer(markers);
    </script>
  </body>
</html>
