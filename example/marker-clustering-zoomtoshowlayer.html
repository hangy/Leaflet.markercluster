<!doctype html>
<html>
  <head>
    <title>Leaflet debug page</title>

    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet.markercluster": "../dist/leaflet.markercluster-esm.js"
        }
      }
    </script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
      integrity="sha512-/Zt0ZlKYvvW9BBzNnOHT+QYeT/cGTk6OC4mKrI/FOJXDDvgABw7lUBBMoqDnpOS4HgQ8LwdL+yJ7ArjBoL7ITQ=="
      crossorigin="anonymous"
      type="module"
    ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="screen.css" />

    <link rel="stylesheet" href="../dist/MarkerCluster.css" />
    <link rel="stylesheet" href="../dist/MarkerCluster.Default.css" />

    <script src="realworld.388.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <button id="doit">Zoom to marker</button>
    <span>When clicked we will zoom down to a marker, spiderfying if required to show it and then open its popup</span>
    <script type="module">
      import { Map, TileLayer, LatLng, Marker } from "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js";
      import { MarkerClusterGroup } from "../dist/leaflet.markercluster-esm.js";
      
      var tiles = new TileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }),
        latlng = new LatLng(-37.82, 175.24);

      var map = new Map("map", { center: latlng, zoom: 13, layers: [tiles] });

      var markers = new MarkerClusterGroup();
      var markerList = [];

      function populate() {
        for (var i = 0; i < addressPoints.length; i++) {
          var a = addressPoints[i];
          var title = a[2];
          var marker = new Marker(new LatLng(a[0], a[1]), { title: title });
          marker.bindPopup(title);
          markers.addLayer(marker);
          markerList.push(marker);
        }
      }

      populate();

      map.addLayer(markers);

      document.getElementById("doit").onclick = function () {
        var m = markerList[Math.floor(Math.random() * markerList.length)];
        markers.zoomToShowLayer(m, function () {
          m.openPopup();
        });
      };
    </script>
  </body>
</html>
