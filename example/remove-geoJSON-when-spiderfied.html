<!doctype html>
<html>
  <head>
    <title>Leaflet debug page</title>

    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet.markercluster": "../dist/leaflet.markercluster-esm.js"
        }
      }
    </script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
      integrity="sha512-/Zt0ZlKYvvW9BBzNnOHT+QYeT/cGTk6OC4mKrI/FOJXDDvgABw7lUBBMoqDnpOS4HgQ8LwdL+yJ7ArjBoL7ITQ=="
      crossorigin="anonymous"
      type="module"
    ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="screen.css" />

    <link rel="stylesheet" href="../dist/MarkerCluster.css" />
    <link rel="stylesheet" href="../dist/MarkerCluster.Default.css" />
  </head>
  <body>
    <div id="map"></div>
    <button id="doit">Remove marker #1</button><button id="doit2">Remove marker #2</button><br />
    <span>New Bug. Spiderfy the cluster then click the button #1. All markers disapear, but it should remain marker #2.</span><br />
    <span>New Bug. Spiderfy the cluster then click the button #2. All markers disapear, but it should remain marker #1.</span><br />

    <script type="module">
      import { GeoJSON, Map, TileLayer, LatLng, Marker, DomUtil } from "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js";
      import { MarkerClusterGroup } from "../dist/leaflet.markercluster-esm.js";
      
      var tiles = new TileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }),
        latlng = new LatLng(50.5, 30.51);

      var map = new Map("map", { center: latlng, zoom: 15, layers: [tiles] });

      var markers = new MarkerClusterGroup({ disableClusteringAtZoom: 19 });
      var markersList = [];
      var m;

      let geoJsonFeature = {
        type: "FeatureCollection",
        features: [
          {
            type: "Feature",
            geometry: {
              type: "Point",
              coordinates: [30.51, 50.5]
            }
          }
        ]
      };
      m = new GeoJSON(geoJsonFeature, {
        pointToLayer: function (feature, latlng) {
          return new Marker(latlng);
        }
      });
      markersList.push(m);
      markers.addLayer(m);

      geoJsonFeature = {
        type: "FeatureCollection",
        features: [
          {
            type: "Feature",
            geometry: {
              type: "Point",
              coordinates: [30.5101, 50.5]
            }
          }
        ]
      };
      m = new GeoJSON(geoJsonFeature, {
        pointToLayer: function (feature, latlng) {
          return new Marker(latlng);
        }
      });
      markersList.push(m);
      markers.addLayer(m);

      map.addLayer(markers);

      DomUtil.get("doit").onclick = function () {
        markers.removeLayer(markersList[0]);
      };

      DomUtil.get("doit2").onclick = function () {
        markers.removeLayer(markersList[1]);
      };
    </script>
  </body>
</html>
