<!doctype html>
<html>
  <head>
    <title>Leaflet debug page</title>

    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "leaflet.markercluster": "../dist/leaflet.markercluster-esm.js"
        }
      }
    </script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
      integrity="sha512-/Zt0ZlKYvvW9BBzNnOHT+QYeT/cGTk6OC4mKrI/FOJXDDvgABw7lUBBMoqDnpOS4HgQ8LwdL+yJ7ArjBoL7ITQ=="
      crossorigin="anonymous"
      type="module"
    ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="screen.css" />

    <link rel="stylesheet" href="../dist/MarkerCluster.css" />
    <link rel="stylesheet" href="../dist/MarkerCluster.Default.css" />
  </head>
  <body>
    <div id="map"></div>

    <script type="module">
      import { Map, TileLayer, GeoJSON } from "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js";
      import { MarkerClusterGroup } from "../dist/leaflet.markercluster-esm.js";

      var geoJsonData = {
        type: "FeatureCollection",
        features: [
          { type: "Feature", id: "1", properties: { address: "2" }, geometry: { type: "Point", coordinates: [175.2209316333, -37.8210922667] } },
          { type: "Feature", id: "2", properties: { address: "151" }, geometry: { type: "Point", coordinates: [175.2238417833, -37.80975435] } },
          { type: "Feature", id: "3", properties: { address: "21" }, geometry: { type: "Point", coordinates: [175.2169955667, -37.818193] } },
          { type: "Feature", id: "4", properties: { address: "14" }, geometry: { type: "Point", coordinates: [175.2240856667, -37.8216963] } },
          { type: "Feature", id: "5", properties: { address: "38B" }, geometry: { type: "Point", coordinates: [175.2196982333, -37.8188702167] } },
          { type: "Feature", id: "6", properties: { address: "38" }, geometry: { type: "Point", coordinates: [175.2209942, -37.8192782833] } }
        ]
      };

      var tiles = new TileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      });

      var map = new Map("map").addLayer(tiles);

      var markers = new MarkerClusterGroup();

      var geoJsonLayer = new GeoJSON(geoJsonData, {
        onEachFeature: function (feature, layer) {
          layer.bindPopup(feature.properties.address);
        }
      });
      markers.addLayer(geoJsonLayer);

      map.addLayer(markers);
      map.fitBounds(markers.getBounds());
    </script>
  </body>
</html>
